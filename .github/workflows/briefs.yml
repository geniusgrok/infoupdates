name: Market briefs

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Generate
        type: choice
        default: all
        options: [all, ashare, ashare-morning, ashare-close, usstock, usstock-premarket, usstock-postmarket, weekly]
      date:
        description: Edition date YYYY-MM-DD; weekly uses its containing week; blank uses current editions
        type: string
        required: false
        default: ''
      watermark:
        description: Watermark text; blank disables it; use force to change existing results
        type: string
        required: false
        default: 一张图盘前盘后
      force:
        description: Regenerate and replace existing results
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '0 12,13 * * 1-5'
    - cron: '30 20,21 * * 1-5'
    - cron: '15 2 * * 6'

concurrency:
  group: market-archive
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore complete archive
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p archive
          gh api --paginate --jq '.artifacts[] | @json' "repos/$GITHUB_REPOSITORY/actions/artifacts?name=market-archive&per_page=100" > /tmp/archive-artifacts.json
          BRIEF_ARTIFACT_ID=$(python - <<'PY'
          import json
          from pathlib import Path
          artifacts = [json.loads(line) for line in Path('/tmp/archive-artifacts.json').read_text().splitlines() if line]
          usable = [a for a in artifacts if a['name'] == 'market-archive' and not a['expired']
                    and a.get('workflow_run', {}).get('head_branch') == 'main']
          print(max(usable, key=lambda a: a['created_at'])['id'] if usable else '')
          PY
          )
          if [ -n "$BRIEF_ARTIFACT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$BRIEF_ARTIFACT_ID/zip" > /tmp/market-archive.zip
            unzip -q /tmp/market-archive.zip -d archive
            test -f archive/market.sqlite3
          fi
      - name: Generate selected editions
        env:
          BRIEF_REQUEST: ${{ inputs.edition }}
          BRIEF_FORCE: ${{ inputs.force }}
          BRIEF_DATE: ${{ inputs.date }}
          BRIEF_WATERMARK: ${{ inputs.watermark }}
        run: |
          python - <<'PY'
          import os
          from datetime import date, datetime, timedelta, timezone
          from ashare.__main__ import main as ashare
          from ashare.calendar import is_trading_day as a_trading
          from ashare.models import CST
          from usstock.__main__ import main as usstock
          from usstock.calendar import is_trading_day as u_trading
          from usstock.models import NY
          from weekly.__main__ import main as weekly
          from review.__main__ import main as review

          request = os.environ.get('BRIEF_REQUEST', '')
          force = ['--force'] if os.environ.get('BRIEF_FORCE') == 'true' else []
          watermark = ['--watermark=' + os.environ.get('BRIEF_WATERMARK', '')] if request else []
          selected_date = os.environ.get('BRIEF_DATE', '').strip()
          if selected_date and date.fromisoformat(selected_date).isoformat() != selected_date:
              raise ValueError('date must use YYYY-MM-DD')
          day = ['--date', selected_date] if selected_date else []
          now = datetime.now(timezone.utc)
          cn, us = now.astimezone(CST), now.astimezone(NY)
          jobs = []
          editions = {
              'ashare': (ashare, 'all'),
              'ashare-morning': (ashare, 'morning'),
              'ashare-close': (ashare, 'close'),
              'usstock': (usstock, 'all'),
              'usstock-premarket': (usstock, 'premarket'),
              'usstock-postmarket': (usstock, 'postmarket'),
          }
          if request == 'all':
              jobs = [(ashare, ['all', *day, *force, *watermark]), (usstock, ['all', *day, *force, *watermark])]
          if request in editions:
              module, session = editions[request]
              jobs = [(module, [session, *day, *force, *watermark])]
          if request == 'weekly':
              week = []
              if selected_date:
                  selected = date.fromisoformat(selected_date)
                  week = ['--week', (selected - timedelta(days=selected.weekday())).isoformat()]
              jobs = [(weekly, ['--backfill', *week, *force, *watermark])]
          if not request:
              if a_trading(cn.date()) and cn.hour == 8:
                  jobs.append((ashare, ['morning']))
              if a_trading(cn.date()) and cn.hour == 15:
                  jobs.append((ashare, ['close']))
              if u_trading(us.date()) and us.hour == 8:
                  jobs.append((usstock, ['premarket']))
              if u_trading(us.date()) and us.hour == 16:
                  jobs.append((usstock, ['postmarket']))
              if cn.weekday() == 5 and cn.hour == 10:
                  jobs.append((weekly, ['--backfill', *force]))
          failed = False
          for module, arguments in jobs:
              try:
                  module(arguments)
              except SystemExit as exc:
                  if exc.code:
                      failed = True
                      print(f'{module.__module__} failed: {exc.code}', flush=True)
          review(['history'])
          if failed:
              raise SystemExit(1)
          PY
      - name: Downloadable images and text
        if: ${{ always() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: market-briefs
          path: |
            output/*.png
            output/*.txt
          retention-days: 30
          if-no-files-found: ignore
      - name: Save complete archive, including partial-run data
        if: ${{ always() && steps.restore.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: market-archive
          path: archive/
          retention-days: 90
          if-no-files-found: error
